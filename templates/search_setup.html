<script src="js/fuse.js"></script>
<script src="js/search_data.js"></script>

<style>
  /* Container to align search bar inline with the menu items */
  #nav-search-container {
    display: inline-flex;
    align-items: center;
    position: relative;
    margin-left: 15px;
    margin-right: 10px;
    height: 100%; /* Match navbar height */
  }

  /* The input wrapper allows us to position the 'X' button inside */
  .search-input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }

  #nav-search-input {
    padding: 6px 30px 6px 12px; /* Extra padding on right for the X button */
    border-radius: 20px;
    border: 1px solid #ccc;
    font-size: 0.85rem;
    width: 160px;
    transition: width 0.3s ease;
    outline: none;
    background-color: rgba(255, 255, 255, 0.9);
  }

  #nav-search-input:focus {
    width: 240px;
    border-color: #055099;
    background-color: #fff;
    box-shadow: 0 0 4px rgba(5, 80, 153, 0.2);
  }

  /* Clear button (X) inside the search bar */
  #search-clear-btn {
    position: absolute;
    right: 10px;
    cursor: pointer;
    color: #999;
    font-weight: bold;
    display: none; /* Hidden by default */
    user-select: none;
  }

  #search-clear-btn:hover {
    color: #333;
  }

  /* Dropdown for search results */
  #nav-search-results {
    position: absolute;
    top: calc(100% + 10px);
    right: 0;
    width: 320px;
    background: white;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    border-radius: 6px;
    max-height: 450px;
    overflow-y: auto;
    z-index: 10000;
    border: 1px solid #eee;
  }

  .nav-search-item {
    padding: 12px;
    border-bottom: 1px solid #f0f0f0;
  }

  .nav-search-item:last-child {
    border-bottom: none;
  }

  .nav-search-item a {
    text-decoration: none;
    color: #055099 !important; /* Force color over distill defaults */
    font-weight: 600;
    font-size: 0.9rem;
    display: block;
    margin-bottom: 3px;
  }

  .nav-search-item small {
    color: #666;
    font-size: 0.75rem;
    display: block;
    line-height: 1.2;
  }

  .nav-search-item:hover {
    background-color: #f9f9f9;
  }
</style>

<script>
document.addEventListener("DOMContentLoaded", function() {
  // 1. Target the right-hand navigation container
  const navRight = document.querySelector('.nav-right'); 
  
  if (navRight) {
    const searchWrapper = document.createElement('div');
    searchWrapper.id = 'nav-search-container';
    searchWrapper.innerHTML = `
      <div class="search-input-wrapper">
        <input type="text" id="nav-search-input" placeholder="🔍 Search resources..." autocomplete="off">
        <span id="search-clear-btn">&times;</span>
      </div>
      <div id="nav-search-results"></div>
    `;
    
    // Append to put it to the right of the menu items
    navRight.appendChild(searchWrapper);
    
    // Ensure the parent container keeps everything in a single row
    navRight.style.display = 'flex';
    navRight.style.flexDirection = 'row';
    navRight.style.alignItems = 'center';
  }

  const input = document.getElementById('nav-search-input');
  const results = document.getElementById('nav-search-results');
  const clearBtn = document.getElementById('search-clear-btn');
  let fuse;

  // 2. Fetch the local JSON index generated by R
  // Replace the entire fetch(...) .then(...) block with this:
  try {
    if (typeof searchData !== 'undefined') {
      console.log("Search data loaded locally:", searchData);
      fuse = new Fuse(searchData, {
        includeScore: true,
        shouldSort: true,
        threshold: 0.2, // Adjust for sensitivity
        ignoreLocation: true,
        keys: [
          { name: "title", weight: 0.5 },
          { name: "section", weight: 0.3 },
          { name: "subtitle", weight: 0.15 }  
          ]
      });
    } else {
      console.error("searchData variable not found. Check if js/search_data.js is loaded.");
    }
  } catch (err) {
    console.error("Error initializing Fuse with local data:", err);
  }
  
  
  // 3. Search logic
  input.addEventListener('input', () => {
    const query = input.value;
    
    // Toggle the Clear (X) button visibility
    clearBtn.style.display = query.length > 0 ? 'block' : 'none';

    if (query.length < 2) {
      results.innerHTML = '';
      return;
    }
    
    if (fuse) {
      const searchRes = fuse.search(query);
      if (searchRes.length === 0) {
        results.innerHTML = '<div class="nav-search-item"><small>No results found</small></div>';
      } else {
        results.innerHTML = searchRes.map(r => `
          <div class="nav-search-item">
            <a href="${r.item.url_loc}">${r.item.title || r.item.section}</a>
            <small>${r.item.site_loc}</small>
            <small><strong>${r.item.section}</strong> ${r.item.subtitle ? '• ' + r.item.subtitle : ''}</small>
          </div>
        `).join('');
      }
    }
  });

  // 4. Clear button functionality
  clearBtn.addEventListener('click', () => {
    input.value = '';
    results.innerHTML = '';
    clearBtn.style.display = 'none';
    input.focus();
  });

  // 5. Close results when clicking anywhere else on the page
  document.addEventListener('click', (e) => {
    const container = document.getElementById('nav-search-container');
    if (container && !container.contains(e.target)) {
      results.innerHTML = '';
    }
  });
});
</script>
